<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Options</title>
  <link rel="stylesheet" href="../css/options.css">
  <script src="../lib/Sortable.min.js"></script>
  <script src="../js/options.js"></script>
</head>
<body>
  <header>
    <h1>Options</h1>
  </header>
  <ul id="list-of-fieldsets"></ul>
  <hr>
  <div class="buttons-box">
    <div>
      <p>To save all changes, click the Save button</p>
      <p>To discard all changes, just close this window</p>
    </div>
    <button id="save-button">Save</button>
    <div id="error-bag"></div>
  </div>
  <hr>
  <div class="buttons-wrapper">
    <div class="buttons-box">
      <button id="add-search-button">Add Search</button>
      <button id="add-separator-button">Add Separator</button>
      <button id="import-button">Import</button>
    </div>
    <div class="buttons-box">
      <button id="load-defaults-button">Load Defaults</button>
      <button id="sort-a-z-button">Sort (A-Z)</button>
      <button id="export-button">Export</button>
    </div>
  </div>
  <footer>
    <p><a href="https://grinvik.com/donate" target="_blank">💲 Donate 💲</a></p>
    <br>
    <p><span>*</span> Besides donations, you can thank the author by using Yandex services</p>
    <br>
    <p><span>*</span> Share your ideas and suggestions at roman.m.grinyov@gmail.com</p>
  </footer>
  <template id="fieldset-template">
    <li>
      <span class="up-down-arrow">↕</span>
      <input placeholder="Name" class="search-name">
      <input placeholder="URL with %s in place of query" class="search-url">
      <span class="remove-fieldset-button">×</span>
    </li>
  </template>
  <template id="separator-template">
    <li>
      <span class="up-down-arrow">↕</span>
      <span class="separator"></span>
      <span class="remove-fieldset-button">×</span>
    </li>
  </template>
</body>
</html>
